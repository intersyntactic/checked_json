include: package:lints/recommended.yaml

# Strict: an implicit `dynamic` -- a cast that is not written, a generic left
# raw, a type the compiler had to give up on -- is an error, not a silence.
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  # A lint is an info, and infos leave `dart analyze` exiting 0. These three
  # are errors so that a plain `dart analyze` fails on them.
  errors:
    only_throw_errors: error
    avoid_catching_errors: error
    avoid_catches_without_on_clauses: error

linter:
  rules:
    - avoid_dynamic_calls
    # Error and Exception used as Dart means them: an Error is a programming
    # bug, not caught; an Exception is a condition the caller handles. So
    # only those are thrown, an Error is never caught, and every catch says
    # what it catches.
    - only_throw_errors
    - avoid_catching_errors
    - avoid_catches_without_on_clauses
