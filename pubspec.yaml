name: checked_json
description: >-
  A JSON object type you only get by checking a value, with typed readers that
  name the field that is absent or the wrong shape.
version: 0.2.1
repository: https://github.com/intersyntactic/checked_json

environment:
  # 3.3 is the first with extension types.
  sdk: ^3.3.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
